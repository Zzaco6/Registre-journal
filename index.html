<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Événements de la journée — Sécurité publique</title>
<style>
  :root {
    --rouge: #C0001E;
    --rouge-fonce: #8f0016;
    --encre: #1c1c1c;
    --gris-texte: #5a5a5a;
    --fond: #f6f5f3;
    --carte: #ffffff;
    --ligne: #e2e0dc;
    --vert-ok: #2f7d4f;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--fond);
    color: var(--encre);
    min-height: 100vh;
  }

  header {
    background: var(--encre);
    color: #fff;
    padding: 18px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 4px solid var(--rouge);
  }

  header .titre {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  header .titre .eyebrow {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--rouge);
    font-weight: 700;
  }

  header h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 600;
  }

  header .compteur {
    background: var(--rouge);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    padding: 6px 14px;
    border-radius: 999px;
    min-width: 32px;
    text-align: center;
  }

  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 28px 20px 80px;
  }

  .carte {
    background: var(--carte);
    border: 1px solid var(--ligne);
    border-radius: 10px;
    padding: 24px;
    margin-bottom: 20px;
  }

  .progression {
    display: flex;
    gap: 6px;
    margin-bottom: 22px;
  }

  .progression .segment {
    flex: 1;
    height: 4px;
    border-radius: 2px;
    background: var(--ligne);
    transition: background 0.25s ease;
  }
