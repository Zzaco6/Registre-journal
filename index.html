<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Événements de la journée — Sécurité publique</title>
<style>
  :root {
    --rouge: #C0001E;
    --rouge-fonce: #8f0016;
    --encre: #1c1c1c;
    --gris-texte: #5a5a5a;
    --fond: #f6f5f3;
    --carte: #ffffff;
    --ligne: #e2e0dc;
    --vert-ok: #2f7d4f;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--fond);
    color: var(--encre);
    min-height: 100vh;
  }

  header {
    background: var(--encre);
    color: #fff;
    padding: 18px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 4px solid var(--rouge);
  }

  header .titre {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  header .titre .eyebrow {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--rouge);
    font-weight: 700;
  }

  header h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 600;
  }

  header .compteur {
    background: var(--rouge);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    padding: 6px 14px;
    border-radius: 999px;
    min-width: 32px;
    text-align: center;
  }

  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 28px 20px 80px;
  }

  .carte {
    background: var(--carte);
    border: 1px solid var(--ligne);
    border-radius: 10px;
    padding: 24px;
    margin-bottom: 20px;
  }

  .progression {
    display: flex;
    gap: 6px;
    margin-bottom: 22px;
  }

  .progression .segment {
    flex: 1;
    height: 4px;
    border-radius: 2px;
    background: var(--ligne);
    transition: background 0.25s ease;
  }

  .progression .segment.actif,
  .progression .segment.fait {
    background: var(--rouge);
  }

  .etape { display: none; }
  .etape.visible { display: block; }

  .etape .num {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--rouge);
    margin-bottom: 6px;
  }

  .etape h2 {
    margin: 0 0 14px;
    font-size: 20px;
  }

  .etape p.aide {
    color: var(--gris-texte);
    font-size: 14px;
    line-height: 1.5;
    margin-bottom: 18px;
  }

  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--encre);
  }

  input[type="text"],
  input[type="date"],
  input[type="time"],
  textarea,
  select {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--ligne);
    border-radius: 6px;
    font-size: 15px;
    font-family: inherit;
    background: #fff;
    margin-bottom: 16px;
  }

  input:focus, textarea:focus, select:focus {
    outline: 2px solid var(--rouge);
    outline-offset: 1px;
    border-color: var(--rouge);
  }

  .ligne-double {
    display: flex;
    gap: 12px;
  }
  .ligne-double > div { flex: 1; }

  textarea { min-height: 110px; resize: vertical; }

  .actions {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-top: 6px;
  }

  button {
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 11px 20px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  button:active { transform: scale(0.98); }

  .btn-suivant, .btn-ajouter {
    background: var(--rouge);
    color: #fff;
    margin-left: auto;
  }
  .btn-suivant:hover, .btn-ajouter:hover { background: var(--rouge-fonce); }

  .btn-retour {
    background: transparent;
    color: var(--gris-texte);
    border: 1px solid var(--ligne);
  }
  .btn-retour:hover { background: #f0efec; }

  .recap-champ {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid var(--ligne);
    font-size: 14px;
  }
  .recap-champ:last-of-type { border-bottom: none; }
  .recap-champ .clef { color: var(--gris-texte); }
  .recap-champ .valeur { font-weight: 600; text-align: right; max-width: 60%; }

  section.liste-jour h2 {
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--gris-texte);
    margin: 0 0 14px;
  }

  .entree {
    border: 1px solid var(--ligne);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 10px;
    position: relative;
    background: #fdfdfc;
  }

  .entree .en-tete {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
  }

  .entree .titre-entree {
    font-weight: 700;
    font-size: 14px;
  }

  .entree .creneau {
    font-size: 12px;
    color: var(--rouge);
    font-weight: 700;
  }

  .entree .desc {
    font-size: 13px;
    color: var(--gris-texte);
    line-height: 1.4;
  }

  .entree .supprimer {
    position: absolute;
    top: 10px;
    right: 10px;
    background: none;
    border: none;
    color: var(--gris-texte);
    font-size: 16px;
    padding: 2px 6px;
    line-height: 1;
  }
  .entree .supprimer:hover { color: var(--rouge); }

  .entree .modifier {
    position: absolute;
    top: 10px;
    right: 38px;
    background: none;
    border: none;
    color: var(--gris-texte);
    font-size: 16px;
    padding: 2px 6px;
    line-height: 1;
  }
  .entree .modifier:hover { color: var(--rouge); }

  .vide {
    text-align: center;
    padding: 30px 10px;
    color: var(--gris-texte);
    font-size: 14px;
  }

  .barre-finale {
    display: flex;
    gap: 10px;
    margin-top: 18px;
  }

  .btn-envoyer {
    background: var(--vert-ok);
    color: #fff;
    flex: 1;
    padding: 13px;
    font-size: 15px;
  }
  .btn-envoyer:hover { background: #245f3d; }
  .btn-envoyer:disabled {
    background: var(--ligne);
    color: var(--gris-texte);
    cursor: not-allowed;
  }

  .btn-vider {
    background: transparent;
    border: 1px solid var(--ligne);
    color: var(--gris-texte);
    padding: 13px 16px;
  }
  .btn-vider:hover { background: #f0efec; color: var(--rouge); }

  .confirmation {
    display: none;
    background: #f0f8f2;
    border: 1px solid #cfe8d6;
    color: var(--vert-ok);
    padding: 12px 14px;
    border-radius: 6px;
    font-size: 13px;
    margin-top: 14px;
  }
  .confirmation.visible { display: block; }

  footer {
    text-align: center;
    font-size: 12px;
    color: var(--gris-texte);
    padding: 20px;
  }

  @media (max-width: 480px) {
    .ligne-double { flex-direction: column; gap: 0; }
    header h1 { font-size: 16px; }
  }
</style>
</head>
